<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Blitz Shockwave</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #000; color: #ccc; font: 14px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    #note { max-width: 36em; padding: 16px; line-height: 1.5; }
    #controls { margin: 0; padding: 0 16px; color: #999; text-align: center; line-height: 1.6; }
    kbd { color: #fff; border: 1px solid #555; border-radius: 3px; padding: 0 4px; font: inherit; }
    code { color: #fff; }
    #stage { position: relative; }
    #menu-focus {
      position: absolute; pointer-events: none; display: none; box-sizing: border-box;
      border: 2px solid #ffe14d; border-radius: 4px; box-shadow: 0 0 8px #ffe14d;
    }
  </style>
</head>
<body>
  <div id="stage"><div id="menu-focus"></div></div>
  <p id="controls">
    Menus: <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> / <kbd>Tab</kbd> choose &nbsp;
    <kbd>Enter</kbd> / <kbd>Space</kbd> select &nbsp; <kbd>Esc</kbd> back<br>
    Fight: <kbd>←</kbd> <kbd>→</kbd> move &nbsp; <kbd>↑</kbd> jump &nbsp; <kbd>↓</kbd> crouch / block &nbsp;
    <kbd>Z</kbd> punch &nbsp; <kbd>X</kbd> kick &nbsp; <kbd>P</kbd> pause &nbsp; <kbd>Esc</kbd> quit match
  </p>
  <script>
    // Plays a Director game through dirplayer-rs (scripts/setup installs it into tools/).
    //   default             build/<game>/web/game.dir (scripts/build: the decompiled movie with
    //                       dirplayer compatibility patches), else src/<game>/movies/game.dir
    //   ?from=src           the unpatched decompiled movie
    //   ?from=original      original/<game>/game.dcr
    //   ?runmode=projector  report "Projector" instead of "Plugin" to the game's Lingo
    //   ?game=<name>        game folder (default ttbattleblitz)
    // The movie loads its char_*.cct casts from its own folder; scripts/serve maps those names to
    // the unprotected .cst files in src/. Browsers block all of this from file:// URLs, so run
    // scripts/serve and open the page over http.
    const params = new URLSearchParams(location.search);
    const game = encodeURIComponent(params.get("game") || "ttbattleblitz");
    const from = params.get("from") || "build";
    const projector = params.get("runmode") === "projector";
    const menuKeys = params.get("menukeys") !== "off";
    const sources = {
      build: "../../build/" + game + "/web/game.dir",
      src: "../../src/" + game + "/movies/game.dir",
      original: "../../original/" + game + "/game.dcr",
    };
    const stage = document.getElementById("stage");

    async function pickSource() {
      if (from !== "build") return sources[from] || sources.src;
      try {
        const r = await fetch(sources.build, { method: "HEAD" });
        if (r.ok) return sources.build;
      } catch (e) {}
      console.warn("No patched build found; run scripts/build. Using the unpatched decompiled movie.");
      return sources.src;
    }

    if (location.protocol === "file:") {
      // Opened straight from disk: hop over to scripts/serve if it's running, else explain.
      const served = "http://localhost:8000/platforms/web/shockwave.html" + location.search;
      stage.innerHTML = '<p id="note">Looking for the local server…</p>';
      fetch(served, { mode: "no-cors" }).then(() => location.replace(served), () => {
        stage.innerHTML = '<p id="note">This page has to be served over HTTP. Run ' +
          '<code>scripts\\serve.ps1</code> (or <code>scripts/serve.sh</code>) from the repo and open ' +
          '<code>http://localhost:8000/platforms/web/shockwave.html</code>.</p>';
      });
    } else pickSource().then(async src => {
      const embed = document.createElement("embed");
      embed.src = src;
      embed.type = "application/x-director";
      if (projector) {
        // dirplayer looks up [data-launch-command] anywhere in the page; it replaces the <embed>,
        // so the attribute lives on its own element.
        const launch = document.createElement("div");
        launch.hidden = true;
        launch.setAttribute("data-launch-command", '--setTheRunMode "Projector"');
        document.body.appendChild(launch);
      }
      embed.width = "600";
      embed.height = "400";
      stage.appendChild(embed);

      // Player: the patched dirplayer built by scripts/build-player when present (Director
      // behaviours dirplayer 0.8.1 gets wrong are fixed there), else the released one.
      // ?player=release forces the released build.
      const players = ["../../tools/dirplayer/polyfill-patched/", "../../tools/dirplayer/polyfill/"];
      if (params.get("player") === "release") players.shift();
      let base = players[players.length - 1];
      for (const p of players) {
        try { if ((await fetch(p + "dirplayer-polyfill.js", { method: "HEAD" })).ok) { base = p; break; } } catch (e) {}
      }
      const s = document.createElement("script");
      s.src = base + "dirplayer-polyfill.js";
      document.head.appendChild(s);
      console.log("[page] player: " + base);

      // Renderer: Canvas2D (dirplayer's software renderer), where the patched player draws
      // film loops straight onto the stage like Director. ?renderer=webgl2 for the GPU one.
      if ((params.get("renderer") || "").toLowerCase() !== "webgl2") {
        (async () => {
          for (let i = 0; i < 300 && !(window.__vm && window.__vm.set_renderer_backend); i++) await new Promise(r => setTimeout(r, 50));
          try { window.__vm.set_renderer_backend("Canvas2D"); } catch (e) { console.warn("[page] renderer switch failed", e); }
        })();
      }

      setupKeyboard();
    });

    function setupKeyboard() {
      // dirplayer only hears the keyboard while its player element has focus, which clicks on
      // the game don't reliably give it. Forward keys from anywhere else on the page, so the
      // game's controls always work. dirplayer maps browser keys to Director's Mac key codes.
      const GAME_KEYS = new Set(["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " ", "Enter", "Escape", "Tab"]);
      const forward = (e, down) => {
        const vm = window.__vm;
        if (!vm || typeof vm.key_down !== "function") return;
        if (stage.contains(document.activeElement) && document.activeElement !== stage) return; // player has focus
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (GAME_KEYS.has(e.key)) e.preventDefault(); // no page scrolling
        if (down) {
          if (!e.repeat) vm.key_down(e.key, e.keyCode);
        } else {
          vm.key_up(e.key, e.keyCode);
        }
      };
      document.addEventListener("keydown", e => forward(e, true));
      document.addEventListener("keyup", e => forward(e, false));

      // The game's menus are mouse-only. On menu screens, arrows/Tab move a highlight between the
      // game's own buttons and Enter/Space clicks the highlighted one, by sending it the same
      // mouse events a real click would. During a fight there are no buttons on screen, so every
      // key goes to the game untouched. This reads the game state through dirplayer's debugging
      // API (window.__vm.mcp_eval_lingo).
      //
      // Buttons are recognised by their cast member names (normal and hover artwork, taken from
      // the button behaviors in the decompiled Lingo). Never read sprite(n).scriptInstanceList
      // here: in dirplayer 0.8.1, reading it before a sprite's behaviors are attached stops them
      // from ever being attached, which broke the intro and character-select screens.
      const BUTTON_MEMBERS = [
        /^loop_title_start_button$/,                                    // title: START
        /^intro_diff_button_border_\w+$/, /^loop_intro_button_\w+$/,    // intro: difficulty
        /^intro_next_border$/, /^loop_intro_next_button$/,              // intro: next
        /^selection_\w+\.(active|inactive)$/, /^loop_selection_\w+_click$/, // select: fighters
        /^select_(heroes|villains)\.\w+$/, /^loop_play_as_\w+_button_over$/, // select: team tabs
        /^button_fight_000$/, /^play_over$/,                            // select/pause: fight
        /^button_controls_012$/, /^controls_over$/,                     // select: controls
        /^back_008$/, /^back_over$/, /^back_button$/, /^back_button_over$/, // back buttons
      ];
      const STAGE_W = 600, STAGE_H = 400, MAX_CHANNEL = 200;
      const ring = document.getElementById("menu-focus");
      let buttons = [];      // [{ ch, name, rect: [l, t, r, b] }]
      let focused = null;    // channel number
      let scanning = false;

      const lingo = async code => {
        try {
          const r = JSON.parse(await window.__vm.mcp_eval_lingo(code));
          return r.success ? r.result_value : null;
        } catch (e) { return null; }
      };
      const unquote = s => (s || "").replace(/^"|"$/g, "");

      async function scan() {
        if (scanning || !window.__vm || !window.__vm.mcp_eval_lingo) return;
        scanning = true;
        try {
          const found = [];
          for (let ch = 1; ch <= MAX_CHANNEL; ch++) {
            const name = unquote(await lingo(`sprite(${ch}).member.name`));
            if (!name || !BUTTON_MEMBERS.some(re => re.test(name))) continue;
            if ((await lingo(`sprite(${ch}).visible`)) !== "1") continue;
            const rect = ((await lingo(`sprite(${ch}).rect`)) || "").match(/-?\d+(\.\d+)?/g);
            if (!rect) continue;
            const [l, t, r, b] = rect.map(Number);
            if (r - l < 2 || b - t < 2 || r <= 0 || b <= 0 || l >= STAGE_W || t >= STAGE_H) continue;
            // Buttons are often several stacked sprites (artwork + the one carrying the behavior);
            // treat sprites at the same spot as one button and send events to all of them.
            const same = found.find(f => f.rect.join() === [l, t, r, b].join());
            if (same) same.chs.push(ch);
            else found.push({ ch, chs: [ch], name, rect: [l, t, r, b] });
          }
          buttons = found;
          if (!buttons.some(b => b.ch === focused)) setFocus(null);
          drawRing();
        } finally {
          scanning = false;
        }
      }
      if (menuKeys) setInterval(scan, 250);

      function drawRing() {
        const btn = buttons.find(b => b.ch === focused);
        const canvas = stage.querySelector("canvas");
        if (!btn || !canvas) { ring.style.display = "none"; return; }
        const c = canvas.getBoundingClientRect(), s = stage.getBoundingClientRect();
        const sx = c.width / STAGE_W, sy = c.height / STAGE_H;
        const [l, t, r, b] = btn.rect;
        Object.assign(ring.style, {
          display: "block",
          left: (c.left - s.left + l * sx - 3) + "px", top: (c.top - s.top + t * sy - 3) + "px",
          width: ((r - l) * sx + 6) + "px", height: ((b - t) * sy + 6) + "px",
        });
      }

      const send = (ch, event) => {
        const btn = buttons.find(b => b.ch === ch);
        return Promise.all((btn ? btn.chs : [ch]).map(c => lingo(`sendSprite(${c}, #${event})`)));
      };

      function setFocus(ch) {
        if (ch === focused) return;
        if (focused !== null) send(focused, "mouseLeave");
        focused = ch;
        if (focused !== null) send(focused, "mouseEnter");
        drawRing();
      }

      const center = b => [(b.rect[0] + b.rect[2]) / 2, (b.rect[1] + b.rect[3]) / 2];
      const PRIMARY = /Start|Fight|Next|Play|Back/i;

      function move(key) {
        if (!buttons.length) return;
        const cur = buttons.find(b => b.ch === focused);
        if (!cur) { setFocus((buttons.find(b => PRIMARY.test(b.name)) || buttons[0]).ch); return; }
        const [cx, cy] = center(cur);
        const dir = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[key];
        let best = null, bestScore = Infinity;
        for (const b of buttons) {
          if (b === cur) continue;
          const [x, y] = center(b), dx = x - cx, dy = y - cy;
          const along = dx * dir[0] + dy * dir[1];
          if (along <= 4) continue; // must lie in the pressed direction
          const across = Math.abs(dx * dir[1]) + Math.abs(dy * dir[0]);
          const score = along + across * 2;
          if (score < bestScore) { bestScore = score; best = b; }
        }
        if (best) setFocus(best.ch);
      }

      function cycle(step) {
        if (!buttons.length) return;
        const order = [...buttons].sort((a, b) => (a.rect[1] - b.rect[1]) || (a.rect[0] - b.rect[0]));
        const i = order.findIndex(b => b.ch === focused);
        setFocus(order[(i + step + order.length) % order.length].ch);
      }

      function click(ch) {
        send(ch, "mouseDown").then(() => send(ch, "mouseUp")).then(() => setTimeout(scan, 100));
      }

      // Capture phase: runs before dirplayer's own key handling, so menu keys don't also reach it.
      window.addEventListener("keydown", e => {
        if (!buttons.length || e.ctrlKey || e.metaKey || e.altKey) return;
        let handled = true;
        if (e.key.startsWith("Arrow")) move(e.key);
        else if (e.key === "Tab") cycle(e.shiftKey ? -1 : 1);
        else if (e.key === "Enter" || e.key === " ") {
          const target = focused ?? (buttons.find(b => /Start|Fight|Next|Play/i.test(b.name)) || {}).ch;
          if (target !== undefined && !e.repeat) click(target); else if (target === undefined) handled = false;
        } else if (e.key === "Escape" || e.key === "Backspace") {
          const back = buttons.find(b => /Back/i.test(b.name));
          if (back && !e.repeat) click(back.ch); else handled = false;
        } else handled = false;
        if (handled) { e.preventDefault(); e.stopImmediatePropagation(); }
      }, true);
      window.addEventListener("resize", drawRing);
    }
  </script>
</body>
</html>
